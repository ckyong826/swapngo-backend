services:
  postgres:
    image: postgres:15-alpine
    container_name: swapngo_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  kafka:
    image: apache/kafka:latest
    container_name: swapngo_kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafkadata:/var/lib/kafka/data
    restart: always

  # Creates the 4 event topics (idempotent). Runs once each deploy, then exits.
  kafka-init:
    image: apache/kafka:latest
    container_name: swapngo_kafka_init
    depends_on:
      - kafka
    command: >
      bash -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list &&
      echo 'Creating kafka topics' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic swap_events_topic --replication-factor 1 --partitions 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic deposit_events_topic --replication-factor 1 --partitions 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic withdraw_events_topic --replication-factor 1 --partitions 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic transfer_events_topic --replication-factor 1 --partitions 1 &&
      echo 'Successfully created topics:' &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
      "
    restart: on-failure

  # API server. Runs GORM AutoMigrate on boot -> DB schema always matches latest code.
  backend:
    image: ${IMAGE:-ghcr.io/ckyong826/swapngo-backend:latest}
    container_name: swapngo_api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_started
    command: ["./api"]
    env_file:
      - .env
    environment:
      # Override .env with Docker-network container names
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BROKERS: kafka:29092
    restart: always

  worker:
    image: ${IMAGE:-ghcr.io/ckyong826/swapngo-backend:latest}
    container_name: swapngo_worker
    command: ["./worker"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      KAFKA_BROKERS: kafka:29092
    restart: always

  # Reverse proxy + auto HTTPS (Let's Encrypt) for swapngo.3utilities.com
  caddy:
    image: caddy:2-alpine
    container_name: swapngo_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  kafkadata:
  caddydata:
  caddyconfig:
